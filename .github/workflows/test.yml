name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test all packages
        run: go test ./...

      - name: Race test critical packages
        run: go test -race . ./internal/runtime/... ./internal/store/...

      - name: Vet all packages
        run: go vet ./...

      - name: Test external consumer
        shell: bash
        run: |
          set -euo pipefail
          consumer="$(mktemp -d)"
          cd "$consumer"
          go mod init example.com/axiom-consumer
          go mod edit -require=github.com/Homiakus/axiom@v0.0.0
          go mod edit -replace=github.com/Homiakus/axiom="$GITHUB_WORKSPACE"
          cat > consumer_test.go <<'EOF'
          package consumer

          import (
            "context"
            "testing"

            "github.com/Homiakus/axiom"
            "github.com/Homiakus/axiom/axm"
            "github.com/Homiakus/axiom/model"
            "github.com/Homiakus/axiom/table"
          )

          type state struct { Value int `json:"value"` }
          type event struct { Value int `json:"value"` }

          func TestPublicPackages(t *testing.T) {
            flow := axiom.NewFlow("consumer", state{})
            axiom.Handle(flow, func(_ context.Context, current state, incoming event) (axiom.FlowResult[state], error) {
              current.Value = incoming.Value
              return axiom.Next(current), nil
            })
            engine, err := axiom.OpenFlow(flow)
            if err != nil { t.Fatal(err) }
            if err := engine.Execution("one").Dispatch(context.Background(), event{Value: 7}); err != nil { t.Fatal(err) }

            definition := model.New("Consumer")
            current := model.State[state](definition, "Current")
            incoming := model.Event[event](definition, "SetValue")
            definition.Rule("set").On(incoming.Trigger()).Set(current.Field("Value"), incoming.Field("Value"))
            if _, err := definition.Compile(); err != nil { t.Fatal(err) }

            if _, err := axm.Parse([]byte("domain Empty\n")); err != nil { t.Fatal(err) }
            if _, err := table.Parse([]byte("[workflow]\nname = \"EmptyTable\"\n")); err != nil { t.Fatal(err) }
          }
          EOF
          go mod tidy
          go test ./...

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run p50 p95 p99 baseline
        run: |
          mkdir -p artifacts
          go run ./cmd/axiombench \
            -memory-ops 20000 \
            -pebble-ops 1000 \
            -replay-events 1000 \
            -replay-runs 200 \
            -concurrency 8 \
            -strict=false \
            -json artifacts/benchmark-results.json \
            -markdown artifacts/benchmark-results.md
          cat artifacts/benchmark-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: axiom-performance-results
          path: artifacts/
          retention-days: 30
