name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Test public module
        id: public
        continue-on-error: true
        run: go test ./... > public-test.log 2>&1

      - name: Test engine module
        id: engine
        continue-on-error: true
        working-directory: axiom-main
        run: go test ./... > ../engine-test.log 2>&1

      - name: Test code generator
        id: generator
        continue-on-error: true
        working-directory: axiom-main/tools/axiomgen
        run: go test ./... > ../../../generator-test.log 2>&1

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-diagnostics
          path: '*-test.log'
          if-no-files-found: error

      - name: Report test results
        if: always()
        run: |
          for log in public-test.log engine-test.log generator-test.log; do
            echo "===== ${log} ====="
            cat "${log}"
          done
          test "${{ steps.public.outcome }}" = "success"
          test "${{ steps.engine.outcome }}" = "success"
          test "${{ steps.generator.outcome }}" = "success"
