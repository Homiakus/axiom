name: finalize-modules

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Normalize module metadata
        run: |
          go mod tidy
          (cd axiom-main/tools/axiomgen && go mod tidy)

      - name: Validate final modules
        run: |
          go test ./...
          (cd axiom-main && go test ./...)
          (cd axiom-main/tools/axiomgen && go test ./...)

      - name: Commit normalized module files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum axiom-main/tools/axiomgen/go.mod axiom-main/tools/axiomgen/go.sum
          if git diff --cached --quiet; then
            echo "Module files are already normalized"
            exit 0
          fi
          git commit -m "Normalize module metadata [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
