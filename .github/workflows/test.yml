name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Tidy public module
        run: go mod tidy

      - name: Tidy code generator module
        working-directory: axiom-main/tools/axiomgen
        run: go mod tidy

      - name: Upload normalized module metadata
        uses: actions/upload-artifact@v4
        with:
          name: normalized-module-files
          path: |
            go.mod
            go.sum
            axiom-main/tools/axiomgen/go.mod
            axiom-main/tools/axiomgen/go.sum
          if-no-files-found: error

      - name: Test public module
        run: go test ./...

      - name: Test engine module
        working-directory: axiom-main
        run: go test ./...

      - name: Test code generator
        working-directory: axiom-main/tools/axiomgen
        run: go test ./...
