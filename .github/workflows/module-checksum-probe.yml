name: module-checksum-probe

on:
  push:
    branches:
      - agent/module-checksum-probe

permissions:
  contents: read

jobs:
  checksum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Resolve published pseudo-version checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts /tmp/axiom-sum-probe
          cd /tmp/axiom-sum-probe
          go mod init example.com/axiom-sum-probe
          go mod download -json github.com/Homiakus/axiom@v0.0.0-20260807173733-983ea659b154 | tee "$GITHUB_WORKSPACE/artifacts/module-download.json"

      - name: Upload checksum result
        uses: actions/upload-artifact@v4
        with:
          name: axiom-module-checksum
          path: artifacts/module-download.json
          retention-days: 1
