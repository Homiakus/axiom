name: apply-codegen

on:
  push:
    branches: [agent/go-first-api]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/go-first-api
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Apply axiomgen enhancement
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f cmd/axiomgen/internal/generate/toml_test.go ]]; then
            echo "Codegen enhancement is already applied"
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/enhance-codegen.yml').read_text()
          section = text.index('      - name: Add TOML frontend support to axiomgen')
          start = text.index('        run: |\n', section) + len('        run: |\n')
          end = text.index('      - name: Commit codegen enhancement', start)
          lines = []
          for line in text[start:end].splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          Path('/tmp/enhance-codegen.sh').write_text('\n'.join(lines) + '\n')
          PY

          bash -x /tmp/enhance-codegen.sh

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/axiomgen go.mod go.sum
          if git diff --cached --quiet; then
            echo "No enhancement changes to commit"
            exit 0
          fi
          git commit -m "Support TOML plans in axiomgen [skip ci]"
          git push origin HEAD:agent/go-first-api
