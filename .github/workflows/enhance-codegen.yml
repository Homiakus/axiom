name: enhance-codegen

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  enhance:
    if: github.event.pull_request.head.ref == 'agent/go-first-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Add TOML frontend support to axiomgen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          codegen = Path('cmd/axiomgen/internal/codegen/codegen.go')
          text = codegen.read_text()
          text = text.replace(
              'type Options struct {\n\tPackageName string\n\tSourcePath  string\n\tSource      []byte\n}',
              'type Options struct {\n\tPackageName string\n\tSourcePath  string\n\tSource      []byte\n\tFormat      string\n}',
          )
          text = text.replace(
              '\tfmt.Fprintln(&b, "\\t\\\"github.com/Homiakus/axiom\\\"")\n\tfmt.Fprintln(&b, ")")',
              '\tfmt.Fprintln(&b, "\\t\\\"github.com/Homiakus/axiom\\\"")\n\tif strings.EqualFold(opts.Format, "toml") {\n\t\tfmt.Fprintln(&b, "\\t\\\"github.com/Homiakus/axiom/table\\\"")\n\t}\n\tfmt.Fprintln(&b, ")")',
          )
          text = text.replace(
              '\twriteLoadAndNew(&b, domain, activities)\n',
              '\twriteLoadAndNew(&b, domain, activities, opts)\n',
          )
          start = text.index('func writeLoadAndNew(')
          end = text.index('func writeAdapters(', start)
          replacement = r'''func writeLoadAndNew(b *bytes.Buffer, domain string, activities []lang.ActivityDecl, opts Options) {
	path := opts.SourcePath
	if path == "" {
		path = domain + ".axm"
	}
	fmt.Fprintf(b, "func Load%s() (*axiom.App, error) {\n", domain)
	if strings.EqualFold(opts.Format, "toml") {
		fmt.Fprintf(b, "\tplan, err := table.Parse([]byte(%sAXMSource))\n", domain)
		fmt.Fprintln(b, "\tif err != nil {")
		fmt.Fprintln(b, "\t\treturn nil, err")
		fmt.Fprintln(b, "\t}")
		fmt.Fprintf(b, "\treturn &axiom.App{Path: %q, Module: plan.Module()}, nil\n", filepath.ToSlash(path))
	} else {
		fmt.Fprintf(b, "\tmodule, err := axiom.CompileAny([]byte(%sAXMSource), axiom.WithSourceName(%q))\n", domain, filepath.ToSlash(path))
		fmt.Fprintln(b, "\tif err != nil {")
		fmt.Fprintln(b, "\t\treturn nil, err")
		fmt.Fprintln(b, "\t}")
		fmt.Fprintf(b, "\treturn &axiom.App{Path: %q, Module: module}, nil\n", filepath.ToSlash(path))
	}
	fmt.Fprintln(b, "}")
	fmt.Fprintln(b)
	fmt.Fprintf(b, "func New%s(impl %sActivities, opts ...axiom.Option) (*axiom.Engine, error) {\n", domain, domain)
	fmt.Fprintln(b, "\tif impl == nil {")
	fmt.Fprintf(b, "\t\treturn nil, axiom.Error{Code: \"AX500\", Kind: \"config\", Message: %q}\n", domain+" activities implementation is required")
	fmt.Fprintln(b, "\t}")
	fmt.Fprintf(b, "\tapp, err := Load%s()\n", domain)
	fmt.Fprintln(b, "\tif err != nil {")
	fmt.Fprintln(b, "\t\treturn nil, err")
	fmt.Fprintln(b, "\t}")
	fmt.Fprintln(b, "\tregistry := axiom.ActivityRegistry{")
	for _, activity := range activities {
		name := exportName(activity.Name)
		fmt.Fprintf(b, "\t\tActivity%s: adapt%s(impl.%s),\n", name, name, name)
	}
	fmt.Fprintln(b, "\t}")
	fmt.Fprintln(b, "\tall := append([]axiom.Option{axiom.WithActivities(registry)}, opts...)")
	fmt.Fprintln(b, "\treturn app.New(all...)")
	fmt.Fprintln(b, "}")
	fmt.Fprintln(b)
}

'''
          text = text[:start] + replacement + text[end:]
          codegen.write_text(text)

          generate = Path('cmd/axiomgen/internal/generate/generate.go')
          text = generate.read_text()
          text = text.replace(
              '"github.com/Homiakus/axiom/cmd/axiomgen/internal/codegen"\n)',
              '"github.com/Homiakus/axiom/cmd/axiomgen/internal/codegen"\n\t"github.com/Homiakus/axiom/table"\n)',
          )
          text = text.replace(
              '\tmodule, err := axiom.CompileAny(source, axiom.WithSourceName(req.File))\n\tif err != nil {\n\t\treturn nil, err\n\t}\n',
              '\tmodule, formatName, err := compileSource(req.File, source)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n',
          )
          text = text.replace(
              '\t\tSource:      source,\n\t})',
              '\t\tSource:      source,\n\t\tFormat:      formatName,\n\t})',
          )
          text = text.replace(
              '\t// If a previous .gen.go exists, extract old source and compute diff.\n\tif genPath := generatedFilePath(req.OutDir, module.Domain); genPath != "" {',
              '\t// AXM keeps semantic source diff support. Other frontends still get deterministic regeneration.\n\tif formatName == "axm" {\n\tif genPath := generatedFilePath(req.OutDir, module.Domain); genPath != "" {',
          )
          text = text.replace(
              '\t}\n\tfor _, file := range files {',
              '\t}\n\t}\n\tfor _, file := range files {',
              1,
          )
          marker = 'func Run(req Request) (Result, error) {'
          helper = r'''func compileSource(path string, source []byte) (*axiom.Module, string, error) {
	if strings.EqualFold(filepath.Ext(path), ".toml") {
		plan, err := table.Parse(source)
		if err != nil {
			return nil, "", err
		}
		return plan.Module(), "toml", nil
	}
	module, err := axiom.CompileAny(source, axiom.WithSourceName(path))
	if err != nil {
		return nil, "", err
	}
	return module, "axm", nil
}

'''
          text = text.replace(marker, helper + marker)
          generate.write_text(text)
          PY

          cat > cmd/axiomgen/internal/generate/toml_test.go <<'EOF'
          package generate

          import (
            "os"
            "path/filepath"
            "strings"
            "testing"
          )

          func TestPreviewTOMLFrontend(t *testing.T) {
            dir := t.TempDir()
            path := filepath.Join(dir, "workflow.toml")
            source := `[workflow]
          name = "GeneratedTable"

          [state.Counter]
          value = 0

          [[event]]
          name = "SetValue"
          [event.fields]
          value = "Int"

          [[transition]]
          name = "set"
          on = "SetValue"
          [transition.set]
          "Counter.value" = "signal.value"
          `
            if err := os.WriteFile(path, []byte(source), 0o600); err != nil { t.Fatal(err) }
            plan, err := Preview(Request{File: path, OutDir: dir, PackageName: "generated"})
            if err != nil { t.Fatal(err) }
            if plan.Domain != "GeneratedTable" { t.Fatalf("domain = %q", plan.Domain) }
            if len(plan.files) == 0 || !strings.Contains(string(plan.files[0].Content), "table.Parse") {
              t.Fatalf("generated TOML loader is missing table.Parse")
            }
          }
          EOF

          gofmt -w cmd/axiomgen/internal/codegen/codegen.go cmd/axiomgen/internal/generate/generate.go cmd/axiomgen/internal/generate/toml_test.go
          go mod tidy

      - name: Commit codegen enhancement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/axiomgen go.mod go.sum
          if git diff --cached --quiet; then
            echo "Codegen enhancement already applied"
            exit 0
          fi
          git commit -m "Support TOML plans in axiomgen [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Validate codegen enhancement
        run: |
          go test ./...
          go vet ./...
