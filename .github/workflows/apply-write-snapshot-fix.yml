name: apply atomic write evaluation fix

on:
  push:
    branches:
      - agent/verify-coffee-example

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Evaluate rule writes from one state snapshot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/verify-coffee-example

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Patch write evaluation and add public API regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('internal/runtime/engine.go')
          text = path.read_text()
          start = text.index('func (e *Engine) applyWrites(')
          end = text.index('\ntype contextRollback struct {', start)
          replacement = r'''func (e *Engine) applyWrites(ctx context.Context, execution *Execution, rule lang.RuleDecl, env evalEnv) ([]string, error) {
	if err := e.checkClaimsFast(execution, nil); err != nil {
		return nil, err
	}

	// Evaluate every right-hand side against one pre-transition snapshot.
	// Otherwise the result depends on target ordering: an early write can
	// change the value observed by a later expression in the same rule.
	evaluationEnv := env
	evaluationEnv.execution = cloneExecution(execution)
	type evaluatedWrite struct {
		name  string
		value any
	}
	evaluated := make([]evaluatedWrite, 0, len(rule.Writes))
	for _, write := range rule.Writes {
		value, err := evalExpr(write.Expr, evaluationEnv)
		if err != nil {
			return nil, fmt.Errorf("rule %s write %s: %w", rule.Name, write.Name, err)
		}
		if err := e.checkContextValue(write.Name, value); err != nil {
			return nil, fmt.Errorf("rule %s write %s: %w", rule.Name, write.Name, err)
		}
		evaluated = append(evaluated, evaluatedWrite{name: write.Name, value: value})
	}

	rollback := contextRollback{}
	changed := make([]string, 0, len(evaluated))
	writes := make(map[string]any, len(evaluated))
	for _, write := range evaluated {
		rollback.capture(execution, write.name)
		if e.setContextValue(execution, write.name, write.value) {
			changed = append(changed, write.name)
			writes[write.name] = write.value
		}
	}
	sort.Strings(changed)
	if len(changed) > 0 {
		beforeComputed := cloneAnyMap(execution.Computed)
		beforeFacts := cloneFacts(execution.Facts)
		beforeFast := e.cloneFastState(execution)
		changedAtoms, err := e.recomputeFast(execution, changedSet(changed))
		if err != nil {
			rollback.restore(e, execution)
			execution.Computed = beforeComputed
			execution.Facts = beforeFacts
			e.restoreFastState(execution, beforeFast)
			return nil, err
		}
		if err := e.checkClaimsFast(execution, changedAtoms); err != nil {
			rollback.restore(e, execution)
			execution.Computed = beforeComputed
			execution.Facts = beforeFacts
			e.restoreFastState(execution, beforeFast)
			return nil, err
		}
	}
	if err := e.store.AppendHistory(ctx, execution.ID, "WriteApplied", map[string]any{"rule": rule.Name, "writes": writes, "changed": changed, "values": e.changedValues(execution, changed)}); err != nil {
		rollback.restore(e, execution)
		return nil, err
	}
	return changed, nil
}
'''
          path.write_text(text[:start] + replacement + text[end:])
          PY

          cat > write_snapshot_semantics_test.go <<'EOF'
          package axiom_test

          import (
          	"context"
          	"testing"

          	"github.com/Homiakus/axiom/model"
          )

          type snapshotAccount struct {
          	Balance int `json:"balance"`
          	Change  int `json:"change"`
          	Revenue int `json:"revenue"`
          }

          type snapshotPurchase struct {
          	ID string `json:"id"`
          }

          func (snapshotPurchase) AxiomEventName() string { return "Purchase" }

          func TestRuleWritesUseOnePreTransitionSnapshot(t *testing.T) {
          	definition := model.New("WriteSnapshot")
          	account := model.State[snapshotAccount](definition, "Account").
          		Default("Balance", 200).
          		Default("Change", 0).
          		Default("Revenue", 0)
          	purchase := model.Event[snapshotPurchase](definition, "Purchase")

          	definition.Rule("purchase").
          		On(purchase.Trigger()).
          		Set(account.Field("Balance"), model.Lit(0)).
          		Set(account.Field("Change"), model.Raw("Account.balance - 140")).
          		Set(account.Field("Revenue"), model.Raw("Account.revenue + 140"))

          	definition.Claim(
          		"conserved",
          		model.Eq(
          			model.Raw("Account.balance + Account.change + Account.revenue"),
          			model.Lit(200),
          		),
          	)

          	plan, err := definition.Compile()
          	if err != nil {
          		t.Fatal(err)
          	}
          	engine, err := plan.New()
          	if err != nil {
          		t.Fatal(err)
          	}
          	run := engine.Execution("account")
          	if err := run.Dispatch(context.Background(), snapshotPurchase{ID: "purchase-1"}); err != nil {
          		t.Fatal(err)
          	}

          	var state snapshotAccount
          	if err := run.State(context.Background(), &state); err != nil {
          		t.Fatal(err)
          	}
          	if state.Balance != 0 || state.Change != 60 || state.Revenue != 140 {
          		t.Fatalf("state = %+v, want balance=0 change=60 revenue=140", state)
          	}
          }
          EOF

          gofmt -w internal/runtime/engine.go write_snapshot_semantics_test.go
          go test ./...

      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/runtime/engine.go write_snapshot_semantics_test.go
          git commit -m 'Evaluate rule writes from one state snapshot'
          git push origin HEAD:agent/verify-coffee-example
