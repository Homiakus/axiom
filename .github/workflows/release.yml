name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer tag to publish, for example v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Validate release input
        shell: bash
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          if [[ ! "$version" =~ ^v0\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a pre-v1 tag such as v0.1.0; got: $version" >&2
            exit 1
          fi
          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "Tag already exists: $version" >&2
            exit 1
          fi
          notes="docs/releases/${version}.md"
          if [[ ! -f "$notes" ]]; then
            echo "Missing release notes: $notes" >&2
            exit 1
          fi

      - name: Verify release candidate
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test ./...
          go vet ./...

      - name: Publish GitHub Release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=(release create "$VERSION" --target "$GITHUB_SHA" --title "Axiom $VERSION" --notes-file "docs/releases/${VERSION}.md")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
