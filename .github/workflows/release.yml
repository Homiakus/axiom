name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer tag to publish, e.g. v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-metadata:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      target_sha: ${{ steps.meta.outputs.target_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Determine and validate release candidate
        id: meta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from main; got ${GITHUB_REF}." >&2
            exit 1
          fi
          ver="${{ inputs.version }}"
          pre="${{ inputs.prerelease }}"
          metadata="$(bash scripts/resolve_release_candidate.sh manual "$ver" origin)"
          printf '%s\n' "$metadata"
          resolved_version="$(awk -F= '$1 == "version" {print $2}' <<<"$metadata")"
          sha="$(awk -F= '$1 == "target_sha" {print $2}' <<<"$metadata")"
          if [[ "$resolved_version" != "$ver" || -z "$sha" ]]; then
            echo "Release metadata resolver returned incomplete output." >&2
            exit 1
          fi

          notes_path="docs/releases/${ver}.md"
          if ! git cat-file -e "${sha}:${notes_path}" 2>/dev/null; then
            echo "Release notes are required on the frozen candidate: ${notes_path}" >&2
            exit 1
          fi
          if [[ -z "$(git show "${sha}:${notes_path}" | tr -d '[:space:]')" ]]; then
            echo "Release notes must not be empty: ${notes_path}" >&2
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          set +e
          http_code="$(curl --silent --show-error --location \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${ver}")"
          curl_status=$?
          set -e
          if [[ $curl_status -ne 0 ]]; then
            echo "Unable to check existing GitHub Release for ${ver}." >&2
            cat "$response_file" >&2 || true
            exit 1
          fi
          case "$http_code" in
            404) ;;
            200)
              echo "GitHub Release already exists for ${ver}; refusing implicit overwrite/recovery." >&2
              exit 1
              ;;
            *)
              echo "Unexpected GitHub API status while checking ${ver}: ${http_code}" >&2
              cat "$response_file" >&2 || true
              exit 1
              ;;
          esac

          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "target_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "==> Qualified release candidate: $ver at $sha (prerelease=$pre)"

  verify:
    name: Full Release CI Verification
    needs: resolve-metadata
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve-metadata.outputs.target_sha }}

  security-verify:
    name: Full Release Security Verification
    needs: resolve-metadata
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ needs.resolve-metadata.outputs.target_sha }}

  build-binaries:
    name: Cross-Compile Binaries (${{ matrix.os }}/${{ matrix.arch }})
    needs: [resolve-metadata, verify, security-verify]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
            archive: tar.gz
          - os: linux
            arch: arm64
            ext: ""
            archive: tar.gz
          - os: darwin
            arch: amd64
            ext: ""
            archive: tar.gz
          - os: darwin
            arch: arm64
            ext: ""
            archive: tar.gz
          - os: windows
            arch: amd64
            ext: ".exe"
            archive: zip
    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve-metadata.outputs.target_sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Build cross-platform binaries
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.resolve-metadata.outputs.version }}
          COMMIT: ${{ needs.resolve-metadata.outputs.target_sha }}
        run: |
          set -euo pipefail
          build_dir="dist/axiom_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "$build_dir"
          ldflags="-s -w -X 'main.Version=${VERSION}' -X 'main.Commit=${COMMIT}'"

          go build -ldflags="$ldflags" -o "${build_dir}/axiomgen${{ matrix.ext }}" ./cmd/axiomgen
          go build -ldflags="$ldflags" -o "${build_dir}/axiombench${{ matrix.ext }}" ./cmd/axiombench
          cp LICENSE README.md "$build_dir/"

          mkdir -p release-assets
          archive_name="axiom_${VERSION}_${GOOS}_${GOARCH}"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && zip -r "../release-assets/${archive_name}.zip" "axiom_${VERSION}_${GOOS}_${GOARCH}")
          else
            tar -czvf "release-assets/${archive_name}.tar.gz" -C dist "axiom_${VERSION}_${GOOS}_${GOARCH}"
          fi

      - name: Upload binary archive artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: release-assets/*
          retention-days: 2

  sbom-and-checksums:
    name: Generate SBOM & SHA256 Checksums
    needs: [resolve-metadata, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve-metadata.outputs.target_sha }}

      - name: Download all binary artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-binaries-*
          path: all-assets/
          merge-multiple: true

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: 'cyclonedx-json'
          output-file: 'all-assets/axiom-sbom.cdx.json'

      - name: Compute SHA256SUMS
        shell: bash
        run: |
          cd all-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: complete-release-bundle
          path: all-assets/*
          retention-days: 2

  docker-publish:
    name: Build & Publish Container Images
    needs: [resolve-metadata, verify, security-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve-metadata.outputs.target_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/axiomgen
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve-metadata.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve-metadata.outputs.version }}
            type=sha,prefix=sha-

      - name: Build and push multi-arch image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.resolve-metadata.outputs.version }}
            COMMIT=${{ needs.resolve-metadata.outputs.target_sha }}

  publish-release:
    name: Publish GitHub Release
    needs: [resolve-metadata, sbom-and-checksums, docker-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve-metadata.outputs.target_sha }}
          fetch-depth: 0

      - name: Download complete release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: complete-release-bundle
          path: dist-release/

      - name: Publish exact frozen release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve-metadata.outputs.version }}
          PRERELEASE: ${{ needs.resolve-metadata.outputs.prerelease }}
          TARGET_SHA: ${{ needs.resolve-metadata.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="docs/releases/${VERSION}.md"
          test -s "$notes_file"

          flags=(--title "Axiom ${VERSION}" --notes-file "$notes_file" --target "$TARGET_SHA")
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi

          gh release create "$VERSION" dist-release/* "${flags[@]}"

          git fetch --quiet --force origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
          resolved_tag_sha="$(git rev-parse "refs/tags/${VERSION}^{commit}")"
          if [[ "$resolved_tag_sha" != "$TARGET_SHA" ]]; then
            echo "Published tag ${VERSION} points to ${resolved_tag_sha}, expected ${TARGET_SHA}." >&2
            exit 1
          fi
          echo "Verified release tag ${VERSION} -> ${resolved_tag_sha}"
