name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact repository ref or SHA to scan
        required: false
        type: string

concurrency:
  group: security-${{ github.ref }}-${{ inputs.ref || 'source' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  govulncheck:
    name: Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  gosec:
    name: SAST Scan (gosec)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify gosec suppression policy
        shell: bash
        run: bash scripts/test_gosec_policy.sh

      - name: Run gosec
        shell: bash
        run: |
          # G101 and G404 are enabled repository-wide. Two reviewed false positives
          # are path-scoped here, then separately constrained by executable checks:
          # deterministic retry jitter (G404) and the public HTTP protocol version (G101).
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 \
            -exclude-dir=examples \
            -exclude-dir=internal/testutil \
            -exclude=G104,G115,G301,G302,G304,G306,G703 \
            -exclude-rules='adgo/runtime\.go:G404;adgo/http_worker\.go:G101' \
            -nosec-require-rules \
            -nosec-require-justification \
            -fmt=text \
            ./...

      - name: Verify scoped G101 false positive
        shell: bash
        run: bash scripts/verify_g101_false_positive.sh
