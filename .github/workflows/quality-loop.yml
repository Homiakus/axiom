name: quality-loop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'   # daily deep boundary campaign
    - cron: '43 3 * * 0'   # weekly full mutation campaign
  workflow_dispatch:
    inputs:
      deep:
        description: Run the repeated deep boundary campaign
        required: false
        default: true
        type: boolean
      mutation_scope:
        description: Mutation scope for a manual run
        required: true
        default: diff
        type: choice
        options:
          - off
          - diff
          - full

concurrency:
  group: quality-loop-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contract:
    name: Plan & Edge-Space Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Validate canonical plan and multidimensional edge space
        shell: bash
        run: bash scripts/quality_loop.sh plan

      - name: Render edge-space summary
        shell: bash
        run: go run ./cmd/qualityloop -mode matrix >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan selection artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-next-task
          path: test-artifacts/quality-next-task.json
          retention-days: 14

  boundary-fast:
    name: Boundary Shuffle & Sentinels
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: contract
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run fast plan-driven quality loop
        shell: bash
        run: bash scripts/quality_loop.sh fast

  boundary-deep:
    name: Deep 3-Way Boundary Campaign
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.deep)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: contract
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run repeated deep campaign
        shell: bash
        run: bash scripts/quality_loop.sh deep

  mutation-diff:
    name: Mutation Test of Changed Go Code
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.mutation_scope == 'diff')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: contract
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install pinned Gremlins
        shell: bash
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      - name: Mutation-test the diff
        shell: bash
        env:
          QUALITY_MUTATION_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
          QUALITY_MUTATION_EFFICACY: '80'
          QUALITY_MUTATION_COVERAGE: '70'
        run: bash scripts/quality_loop.sh mutation-diff

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-diff-report
          path: test-artifacts/mutation-diff.json
          if-no-files-found: ignore
          retention-days: 30

  mutation-full:
    name: Weekly Full Mutation Baseline
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '43 3 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.mutation_scope == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: contract
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install pinned Gremlins
        shell: bash
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      - name: Run full mutation campaign with bootstrap floor
        shell: bash
        run: |
          mkdir -p test-artifacts
          gremlins unleash \
            --output test-artifacts/mutation-full.json \
            --threshold-efficacy 60 \
            --threshold-mcover 50

      - name: Publish mutation summary
        if: always()
        shell: bash
        run: |
          if [[ -f test-artifacts/mutation-full.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path('test-artifacts/mutation-full.json')
          data = json.loads(p.read_text())
          print('## Mutation testing')
          print(f"- mutants total: {data.get('mutants_total', 0)}")
          print(f"- killed: {data.get('mutants_killed', 0)}")
          print(f"- lived: {data.get('mutants_lived', 0)}")
          print(f"- not covered: {data.get('mutants_not_covered', 0)}")
          print(f"- test efficacy: {data.get('test_efficacy', 0):.2f}%")
          print(f"- mutant coverage: {data.get('mutations_coverage', 0):.2f}%")
          PY
          fi

      - name: Upload full mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-full-report
          path: test-artifacts/mutation-full.json
          if-no-files-found: ignore
          retention-days: 30
