name: fix-go-first

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/go-first-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Apply migration fixes
        shell: bash
        run: |
          set -euo pipefail
          test -f .go-first-migration-complete
          sed -i 's/filepath.Join("..", "..", "examples", "triz",/filepath.Join("examples", "triz",/' triz_test.go
          python - <<'PY'
          from pathlib import Path
          path = Path('cmd/axiomgen/internal/codegen/codegen_test.go')
          text = path.read_text()
          text = text.replace(
              'require axiom v0.0.0\\n\\nreplace axiom => ',
              'require github.com/Homiakus/axiom v0.0.0\\n\\nreplace github.com/Homiakus/axiom => ',
          )
          path.write_text(text)
          PY
          gofmt -w triz_test.go cmd/axiomgen/internal/codegen/codegen_test.go
          go mod tidy

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add triz_test.go cmd/axiomgen/internal/codegen/codegen_test.go go.mod go.sum
          if git diff --cached --quiet; then
            echo "No fixes to commit"
            exit 0
          fi
          git commit -m "Fix Go-first migration tests [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Validate migrated repository
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee /tmp/go-test.log
          go vet ./... 2>&1 | tee /tmp/go-vet.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-first-validation
          path: |
            /tmp/go-test.log
            /tmp/go-vet.log
          if-no-files-found: warn
