name: apply coffee runtime adjustment v2

on:
  push:
    branches:
      - agent/verify-coffee-example

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Remove strict mode from arithmetic coffee example'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/verify-coffee-example

      - name: Patch example and docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in ('examples/coffee-machine/main.go', 'README.md', 'README.en.md'):
              path = Path(filename)
              lines = path.read_text().splitlines(keepends=True)
              filtered = [line for line in lines if 'axiom.WithProductionMode(),' not in line]
              if len(filtered) == len(lines):
                  print(f'no WithProductionMode line in {filename}')
              path.write_text(''.join(filtered))

          ru = Path('README.md')
          text = ru.read_text()
          note = 'В этом примере используется обычный скомпилированный runtime: денежные инварианты содержат арифметические выражения, которые строгий fast runtime пока намеренно не принимает. `WithProductionMode` следует включать только для моделей, полностью поддерживаемых строгим набором выражений.\n'
          if note not in text:
              needle = 'Если обработчик вернёт ошибку, денежные и складские изменения перехода не должны быть зафиксированы.\n'
              if needle not in text:
                  raise SystemExit('Russian README insertion point not found')
              text = text.replace(needle, needle + '\n' + note, 1)
              ru.write_text(text)

          en = Path('README.en.md')
          text = en.read_text()
          note = 'This example uses the regular compiled runtime because its accounting claims contain arithmetic expressions that the strict fast runtime intentionally rejects today. Enable `WithProductionMode` only for models covered by the strict expression subset.\n'
          if note not in text:
              needle = 'If the hardware handler fails, accounting and inventory writes from that transition are not committed.\n'
              if needle not in text:
                  raise SystemExit('English README insertion point not found')
              text = text.replace(needle, needle + '\n' + note, 1)
              en.write_text(text)
          PY

          gofmt -w examples/coffee-machine/main.go
          if grep -R 'axiom.WithProductionMode(),' examples/coffee-machine/main.go README.md README.en.md; then
            echo 'strict mode reference remains in coffee example' >&2
            exit 1
          fi
          go test ./model ./examples/coffee-machine

      - name: Commit adjustment
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md README.en.md examples/coffee-machine/main.go
          git commit -m 'Remove strict mode from arithmetic coffee example'
          git push origin HEAD:agent/verify-coffee-example
