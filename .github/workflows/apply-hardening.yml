name: apply-hardening

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/performance-resilience'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Apply hardening
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_concurrency_hardening.py
          gofmt -w flow.go internal/runtime/transaction.go internal/runtime/types.go internal/runtime/engine.go internal/runtime/execution_api.go internal/syncx/keyed.go
          go test ./...
          go test -race . ./internal/runtime/... ./internal/store/...

      - name: Commit hardened runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply_concurrency_hardening.py .github/workflows/apply-hardening.yml
          git add -A
          git commit -m "Harden concurrent execution and Pebble transactions [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
