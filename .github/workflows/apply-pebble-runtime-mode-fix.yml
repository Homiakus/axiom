name: apply Pebble runtime mode fix

on:
  push:
    branches:
      - agent/verify-coffee-example

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Decouple Pebble durability from strict runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/verify-coffee-example

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Patch engine construction and add regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('axiom.go')
          text = path.read_text()
          old = '''\t// Transactional store → enable strict fast runtime.\n\tif _, ok := cfg.store.(runtimepkg.TransactionalStore); ok {\n\t\tcfg.strictFast = true\n\t}\n\n'''
          new = '''\t// Durability and expression mode are independent. A transactional store\n\t// such as Pebble must not silently enable strict expression validation.\n\t// Strict mode is enabled only by WithStrictFastRuntime or WithProductionMode.\n\n'''
          if old not in text:
              raise SystemExit('automatic strict runtime block not found')
          path.write_text(text.replace(old, new, 1))
          PY

          cat > transactional_runtime_mode_test.go <<'EOF'
          package axiom_test

          import (
          	"testing"

          	"github.com/Homiakus/axiom"
          	"github.com/Homiakus/axiom/model"
          )

          type arithmeticState struct {
          	Left  int `json:"left"`
          	Right int `json:"right"`
          }

          type arithmeticEvent struct {
          	Value int `json:"value"`
          }

          func arithmeticPlan(t *testing.T) *axiom.Plan {
          	t.Helper()
          	definition := model.New("ArithmeticStoreMode")
          	state := model.State[arithmeticState](definition, "State").
          		Default("Left", 0).
          		Default("Right", 0)
          	event := model.Event[arithmeticEvent](definition, "Add")
          	definition.Rule("add").
          		On(event.Trigger()).
          		When(model.GT(event.Field("Value"), model.Lit(0))).
          		Set(state.Field("Left"), model.Raw("State.left + signal.value"))
          	definition.Claim(
          		"sumIsNonNegative",
          		model.GTE(model.Raw("State.left + State.right"), model.Lit(0)),
          	)
          	plan, err := definition.Compile()
          	if err != nil {
          		t.Fatal(err)
          	}
          	return plan
          }

          func TestPebbleDoesNotImplicitlyEnableStrictRuntime(t *testing.T) {
          	plan := arithmeticPlan(t)
          	store, err := axiom.OpenPebble(t.TempDir())
          	if err != nil {
          		t.Fatal(err)
          	}
          	defer store.Close()

          	if _, err := plan.New(axiom.WithStore(store)); err != nil {
          		t.Fatalf("Pebble unexpectedly enabled strict runtime: %v", err)
          	}
          }

          func TestStrictRuntimeRemainsExplicit(t *testing.T) {
          	plan := arithmeticPlan(t)
          	store, err := axiom.OpenPebble(t.TempDir())
          	if err != nil {
          		t.Fatal(err)
          	}
          	defer store.Close()

          	if _, err := plan.New(
          		axiom.WithStore(store),
          		axiom.WithStrictFastRuntime(),
          	); err == nil {
          		t.Fatal("strict runtime accepted an unsupported arithmetic condition")
          	}
          }
          EOF

          gofmt -w axiom.go transactional_runtime_mode_test.go
          go test ./...

      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add axiom.go transactional_runtime_mode_test.go
          git commit -m 'Decouple Pebble durability from strict runtime'
          git push origin HEAD:agent/verify-coffee-example
