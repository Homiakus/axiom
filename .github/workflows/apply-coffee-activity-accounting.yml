name: apply coffee activity accounting

on:
  push:
    branches:
      - agent/verify-coffee-example

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Use confirmed activity amounts for coffee accounting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/verify-coffee-example

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Patch coffee activity outputs and verify scenario
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('examples/coffee-machine/main.go')
          text = path.read_text()

          # Each dispensing activity reports the amounts actually used by the
          # hardware operation. State writes consume these confirmed outputs.
          text = text.replace(
              '\t\tOutput("dispensed", "Bool").\n\t\tEffect("external").',
              '\t\tOutput("dispensed", "Bool").\n\t\tOutput("priceKopecks", "Int").\n\t\tOutput("changeKopecks", "Int").\n\t\tEffect("external").',
          )
          text = text.replace(
              '\t\tOutput("returned", "Bool").\n\t\tEffect("external").',
              '\t\tOutput("returned", "Bool").\n\t\tOutput("amountKopecks", "Int").\n\t\tEffect("external").',
          )

          replacements = {
              'add(machine.Field("ReturnedKopecks"), espressoChange)': 'add(machine.Field("ReturnedKopecks"), model.Ref("output.changeKopecks"))',
              'add(machine.Field("RevenueKopecks"), model.Lit(espressoPriceKopecks))': 'add(machine.Field("RevenueKopecks"), model.Ref("output.priceKopecks"))',
              'sub(machine.Field("CashboxKopecks"), espressoChange)': 'sub(machine.Field("CashboxKopecks"), model.Ref("output.changeKopecks"))',
              'Set(machine.Field("LastChangeKopecks"), espressoChange)': 'Set(machine.Field("LastChangeKopecks"), model.Ref("output.changeKopecks"))',
              'add(machine.Field("ReturnedKopecks"), cappuccinoChange)': 'add(machine.Field("ReturnedKopecks"), model.Ref("output.changeKopecks"))',
              'add(machine.Field("RevenueKopecks"), model.Lit(cappuccinoPriceKopecks))': 'add(machine.Field("RevenueKopecks"), model.Ref("output.priceKopecks"))',
              'sub(machine.Field("CashboxKopecks"), cappuccinoChange)': 'sub(machine.Field("CashboxKopecks"), model.Ref("output.changeKopecks"))',
              'Set(machine.Field("LastChangeKopecks"), cappuccinoChange)': 'Set(machine.Field("LastChangeKopecks"), model.Ref("output.changeKopecks"))',
              'sub(machine.Field("CashboxKopecks"), machine.Field("CreditKopecks"))': 'sub(machine.Field("CashboxKopecks"), model.Ref("output.amountKopecks"))',
              'add(machine.Field("ReturnedKopecks"), machine.Field("CreditKopecks"))': 'add(machine.Field("ReturnedKopecks"), model.Ref("output.amountKopecks"))',
              'Set(machine.Field("LastChangeKopecks"), machine.Field("CreditKopecks"))': 'Set(machine.Field("LastChangeKopecks"), model.Ref("output.amountKopecks"))',
              'return axiom.Output{"dispensed": true}, nil': 'return axiom.Output{\n\t\t\t"dispensed":     true,\n\t\t\t"priceKopecks":  input["priceKopecks"],\n\t\t\t"changeKopecks": input["changeKopecks"],\n\t\t}, nil',
              'return axiom.Output{"returned": true}, nil': 'return axiom.Output{\n\t\t"returned":      true,\n\t\t"amountKopecks": input["amountKopecks"],\n\t}, nil',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'example replacement not found: {old}')
              text = text.replace(old, new)
          path.write_text(text)

          # Keep the central README snippets aligned with the runnable example.
          for filename in ('README.md', 'README.en.md'):
              path = Path(filename)
              text = path.read_text()
              text = text.replace(
                  '    Output("dispensed", "Bool").\n    Effect("external").',
                  '    Output("dispensed", "Bool").\n    Output("priceKopecks", "Int").\n    Output("changeKopecks", "Int").\n    Effect("external").',
              )
              text = text.replace(
                  'add(machine.Field("ReturnedKopecks"), cappuccinoChange)',
                  'add(machine.Field("ReturnedKopecks"), model.Ref("output.changeKopecks"))',
              )
              text = text.replace(
                  'add(machine.Field("RevenueKopecks"), model.Lit(cappuccinoPriceKopecks))',
                  'add(machine.Field("RevenueKopecks"), model.Ref("output.priceKopecks"))',
              )
              text = text.replace(
                  'add(machine.Field("RevenueKopecks"), model.Lit(14000))',
                  'add(machine.Field("RevenueKopecks"), model.Ref("output.priceKopecks"))',
              )
              text = text.replace(
                  'sub(machine.Field("CashboxKopecks"), cappuccinoChange)',
                  'sub(machine.Field("CashboxKopecks"), model.Ref("output.changeKopecks"))',
              )
              text = text.replace(
                  'Set(machine.Field("LastChangeKopecks"), cappuccinoChange)',
                  'Set(machine.Field("LastChangeKopecks"), model.Ref("output.changeKopecks"))',
              )
              path.write_text(text)

          ru = Path('README.md')
          text = ru.read_text()
          text = text.replace(
              'return axiom.Output{"dispensed": true}, nil',
              'return axiom.Output{\n            "dispensed":     true,\n            "priceKopecks":  input["priceKopecks"],\n            "changeKopecks": input["changeKopecks"],\n        }, nil',
          )
          needle = 'Если обработчик вернёт ошибку, денежные и складские изменения перехода не должны быть зафиксированы.\n'
          note = '\nActivity возвращает подтверждённые цену и сдачу. Правило учитывает именно эти значения, а денежные `Claim` проверяют, что результат физической операции согласован с кассой и выручкой.\n'
          if note.strip() not in text:
              text = text.replace(needle, needle + note, 1)
          ru.write_text(text)

          en = Path('README.en.md')
          text = en.read_text()
          needle = 'If the hardware handler fails, accounting and inventory writes from that transition are not committed.\n'
          note = '\nThe activity returns the confirmed price and change. The rule accounts for those outputs, while monetary claims verify that the physical result matches revenue and cashbox state.\n'
          if note.strip() not in text:
              text = text.replace(needle, needle + note, 1)
          en.write_text(text)
          PY

          gofmt -w examples/coffee-machine/main.go
          go test ./...
          output="$(go run ./examples/coffee-machine)"
          printf '%s\n' "$output"
          grep -F 'принято:    350,00 ₽' <<<"$output"
          grep -F 'возвращено: 120,00 ₽' <<<"$output"
          grep -F 'выручка:    230,00 ₽' <<<"$output"
          grep -F 'касса:      230,00 ₽' <<<"$output"
          grep -F 'кредит:     0,00 ₽' <<<"$output"
          grep -F 'напитков:   2' <<<"$output"

      - name: Commit verified example
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md README.en.md examples/coffee-machine/main.go
          git commit -m 'Use confirmed activity amounts for coffee accounting'
          git push origin HEAD:agent/verify-coffee-example
