name: apply coffee runtime adjustment

on:
  push:
    branches:
      - agent/verify-coffee-example

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Use compiled runtime for arithmetic coffee model'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/verify-coffee-example

      - name: Adjust example and README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('examples/coffee-machine/main.go'),
              Path('README.md'),
              Path('README.en.md'),
          ]
          for path in files:
              text = path.read_text()
              text = text.replace('        axiom.WithProductionMode(),\n', '')
              text = text.replace('\t\taxiom.WithProductionMode(),\n', '')
              path.write_text(text)

          ru = Path('README.md')
          text = ru.read_text()
          needle = 'Если обработчик вернёт ошибку, денежные и складские изменения перехода не должны быть зафиксированы.\n'
          replacement = needle + '\nВ этом примере используется обычный скомпилированный runtime: денежные инварианты содержат арифметические выражения, которые строгий fast runtime пока намеренно не принимает. `WithProductionMode` следует включать только для моделей, полностью поддерживаемых строгим набором выражений.\n'
          if needle not in text:
              raise SystemExit('Russian README insertion point not found')
          ru.write_text(text.replace(needle, replacement, 1))

          en = Path('README.en.md')
          text = en.read_text()
          needle = 'If the hardware handler fails, accounting and inventory writes from that transition are not committed.\n'
          replacement = needle + '\nThis example uses the regular compiled runtime because its accounting claims contain arithmetic expressions that the strict fast runtime intentionally rejects today. Enable `WithProductionMode` only for models covered by the strict expression subset.\n'
          if needle not in text:
              raise SystemExit('English README insertion point not found')
          en.write_text(text.replace(needle, replacement, 1))
          PY

          gofmt -w examples/coffee-machine/main.go
          go test ./model ./examples/coffee-machine

      - name: Commit adjustment
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md README.en.md examples/coffee-machine/main.go
          git commit -m 'Use compiled runtime for arithmetic coffee model'
          git push origin HEAD:agent/verify-coffee-example
