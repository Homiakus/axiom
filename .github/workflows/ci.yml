name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Exact repository ref or SHA to verify
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.ref || 'source' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: GolangCI-Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.12.2
          args: --timeout=5m

  module-hygiene:
    name: Module Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify module metadata
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run unit tests
        shell: bash
        run: go test -v ./...

  race-detector:
    name: Race & Concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Race test all packages
        run: go test -race -v ./...

  examples-suite:
    name: Public Examples Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run public examples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-artifacts
          examples=(model go-first order axiom-files table triz)
          for example in "${examples[@]}"; do
            echo "==> Running examples/${example}"
            go run "./examples/${example}" 2>&1 | tee "test-artifacts/${example}.log"
          done
          grep -F 'welcome sent: true' test-artifacts/model.log
          grep -F 'state count=2 history=2' test-artifacts/go-first.log
          grep -F 'status=paid total=1599 receiptSent=true' test-artifacts/order.log
          grep -F 'welcomeSent=true' test-artifacts/axiom-files.log
          grep -F 'welcomeSent=true' test-artifacts/table.log
          grep -F 'domain=HydroPilotMini' test-artifacts/triz.log

      - name: Run coffee machine example
        shell: bash
        run: |
          set -euo pipefail
          go run ./examples/coffee-machine 2>&1 | tee test-artifacts/coffee-machine.log
          grep -F 'принято:    350,00 ₽' test-artifacts/coffee-machine.log
          grep -F 'возвращено: 120,00 ₽' test-artifacts/coffee-machine.log
          grep -F 'выручка:    230,00 ₽' test-artifacts/coffee-machine.log
          grep -F 'касса:      230,00 ₽' test-artifacts/coffee-machine.log
          grep -F 'кредит:     0,00 ₽' test-artifacts/coffee-machine.log
          grep -F 'напитков:   2' test-artifacts/coffee-machine.log

      - name: Upload example logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axiom-example-logs
          path: test-artifacts/
          retention-days: 7

  fuzz-smoke:
    name: Fuzz Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Fuzz parser smoke test
        run: go test ./internal/lang -run=^$ -fuzz=^FuzzParse$ -fuzztime=5s

      - name: Fuzz TRIZ normalizer smoke test
        run: go test ./internal/triz -run=^$ -fuzz=^FuzzNormalize$ -fuzztime=5s

  codegen-verify:
    name: Codegen CLI & Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Build and verify axiomgen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin test-artifacts
          go build -o bin/axiomgen ./cmd/axiomgen

          generated="internal/generatedverify"
          rm -rf "$generated"
          mkdir -p "$generated"
          trap 'rm -rf "$generated"' EXIT

          ./bin/axiomgen \
            --file examples/axiom-files/welcome.axm \
            --out "$generated" \
            --package generatedverify \
            > test-artifacts/axiomgen-result.json
          test -s test-artifacts/axiomgen-result.json
          test -n "$(find "$generated" -maxdepth 1 -type f -print -quit)"

          cat > "$generated/runtime_test.go" <<'GOEOF'
          package generatedverify

          import (
              "context"
              "testing"

              "github.com/Homiakus/axiom"
          )

          type verifyActivities struct{}

          func (verifyActivities) SendWelcomeEmail(_ context.Context, input SendWelcomeEmailInput) (SendWelcomeEmailOutput, error) {
              if input.UserId == nil || *input.UserId != "u1" || input.Email == nil || *input.Email != "user@example.com" {
                  return SendWelcomeEmailOutput{}, axiom.Error{Code: "TEST", Message: "bad generated input"}
              }
              return SendWelcomeEmailOutput{Sent: true}, nil
          }

          func TestGeneratedWrapperRuntime(t *testing.T) {
              ctx := context.Background()
              engine, err := NewWelcome(verifyActivities{})
              if err != nil {
                  t.Fatalf("NewWelcome() error = %v", err)
              }
              if err := engine.Start(ctx, "generated-ci", nil); err != nil {
                  t.Fatalf("Start() error = %v", err)
              }
              if err := engine.Signal(ctx, "generated-ci", "UserRegistered", axiom.Input{
                  "userId": "u1",
                  "email": "user@example.com",
              }); err != nil {
                  t.Fatalf("Signal() error = %v", err)
              }
              if err := engine.RunUntilIdle(ctx, "generated-ci"); err != nil {
                  t.Fatalf("RunUntilIdle() error = %v", err)
              }
          }
          GOEOF

          go test -mod=readonly ./internal/generatedverify

  consumer-test:
    name: Downstream Consumer Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Test external consumer isolation
        shell: bash
        run: bash scripts/test_consumer.sh

  release-metadata-contract:
    name: Release Metadata Contract
    if: ${{ !inputs.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Test frozen release candidate resolution
        shell: bash
        run: |
          bash scripts/test_release_candidate.sh
          bash scripts/test_release_workflow.sh

  bench-smoke:
    name: Benchmark Regression Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run benchmark suite
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          go run ./cmd/axiombench \
            -memory-ops 20000 \
            -pebble-ops 1000 \
            -replay-events 1000 \
            -replay-runs 200 \
            -concurrency 8 \
            -strict=true \
            -json artifacts/benchmark-results.json \
            -markdown artifacts/benchmark-results.md \
            2>&1 | tee artifacts/console.log
          cat artifacts/benchmark-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axiom-performance-results
          path: artifacts/
          retention-days: 30

  ci-gate:
    name: CI Completion Gate
    runs-on: ubuntu-latest
    needs:
      - lint
      - module-hygiene
      - unit-tests
      - race-detector
      - examples-suite
      - fuzz-smoke
      - codegen-verify
      - consumer-test
      - release-metadata-contract
      - bench-smoke
    if: always()
    steps:
      - name: Check all required jobs passed
        shell: bash
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Pipeline job results: $results"
          if [[ "$results" =~ "failure" || "$results" =~ "cancelled" ]]; then
            echo "CI pipeline has failed jobs."
            exit 1
          fi
          echo "All CI pipeline DAG stages completed successfully."
