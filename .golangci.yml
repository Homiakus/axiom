version: "2"
run:
  tests: true
linters:
  enable:
    - misspell
    - unconvert
    - whitespace
  disable:
    - errcheck
    - unused
  settings:
    govet:
      disable:
        - fieldalignment
        - shadow
    misspell:
      locale: US
      ignore-rules:
        - behaviour
        - serialises
        - cancelled
        - labelled
    staticcheck:
      checks:
        - all
        - -QF1001
        - -QF1008
        - -QF1012
        - -S1016
        - -ST1000
        - -ST1003
        - -ST1005
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - staticcheck
          - misspell
        path: _test\.go
      - linters:
          - staticcheck
          - misspell
        path: examples/
      - linters:
          - staticcheck
          - misspell
        path: internal/testutil/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
